---
#################################################################################
# Run shellcheck & shellfmt using the PipelineTemplates shell-quality pipeline. #
#                                                                               #
# This pipeline runs in "check only" mode, it will not change any files.        #
#################################################################################

name: Shell Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/shell-quality-check.yml"
      - ".shellcheckrc"
      - "linux/bash/**"
      - "repo_scripts/**"

  push:
    branches:
      ## Temporary branch trigger while validating centralized quality workflows.
      - feat/central-quality-pipeline
    paths:
      - ".github/workflows/shell-quality-check.yml"
      - ".shellcheckrc"
      - "linux/bash/**"
      - "repo_scripts/**"

  workflow_dispatch:
    inputs:
      pipelinetemplates-ref:
        description: PipelineTemplates branch, tag, or commit SHA to use
        required: false
        type: string
        default: feat/shellcheck-shellfmt-reports

      tools:
        description: Quality tools to run
        required: false
        type: choice
        default: both
        options:
          - both
          - shellcheck
          - shellfmt

      scan-path:
        description: Repository path to scan
        required: false
        type: string
        default: "."

      shellcheck-mode:
        description: ShellCheck finding policy
        required: false
        type: choice
        default: enforce
        options:
          - enforce
          - report-only

      shellfmt-mode:
        description: shellfmt execution mode
        required: false
        type: choice
        default: check
        options:
          - check
          - write

      shellfmt-finding-policy:
        description: shellfmt finding policy
        required: false
        type: choice
        default: enforce
        options:
          - enforce
          - report-only

permissions:
  contents: write

jobs:
  shell-quality:
    name: ShellCheck and shellfmt
    uses: redjax/PipelineTemplates/.github/workflows/shell-quality.yml@feat/shellcheck-shellfmt-reports
    with:
      ## Automatic runs use this feature branch; manual dispatch may override it.
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref || 'feat/shellcheck-shellfmt-reports' }}

      ## Automatic runs use both tools.
      tools: ${{ inputs.tools || 'both' }}

      ## Automatic runs scan the entire repository.
      scan-path: ${{ inputs.scan-path || '.' }}

      ## ShellCheck uses this repository's baseline configuration.
      shellcheck-config-path: ".shellcheckrc"
      use-default-shellcheck-config: false

      ## ShellCheck is inherently check-only. Its selectable mode controls
      #  whether lint findings fail the workflow or are reported as warnings.
      shellcheck-fail-on-findings: ${{ inputs.shellcheck-mode != 'report-only' }}

      ## shellfmt uses PipelineTemplates config/shellfmt/options.
      use-default-shellfmt-config: true

      ## Automatic runs always use check mode. A manual run may select write.
      shellfmt-mode: ${{ inputs.shellfmt-mode || 'check' }}

      ## This workflow never commits formatting changes.
      shellfmt-commit-changes: false

      ## shellfmt findings fail by default; report-only preserves the report,
      #  annotations, and artifacts but does not fail the job.
      shellfmt-fail-on-findings: ${{ inputs.shellfmt-finding-policy != 'report-only' }}

      ## Use repository-specific artifact names.
      shellcheck-artifact-name: system-scripts-shellcheck-results
      shellfmt-artifact-name: system-scripts-shellfmt-results
      artifact-retention-days: 30
